name: Build firmware

# Every push and pull request: host tests + firmware build for every sketch.yaml profile with a
# size check. A GitHub release is only published when started by hand from main with "release".
# The release carries manifest.json + manifest.sig (signed with the OTA_SIGNING_KEY secret):
# devices install it over the air (docs/OTA_UPDATES.md). Channel "stable" = a regular release
# ("latest"); "beta" = a pre-release. Both refresh the fixed "beta" pre-release that beta devices read.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (main only; FW_BUILD must not be released yet)
        type: boolean
        default: false
      whats_new:
        description: "What's new, shown on the devices: up to 3 short lines separated by | (max. 70 characters each)"
        type: string
        default: ""
      min_build:
        description: Oldest build that may install this release over the air (0 = any)
        type: string
        default: "0"
      channel:
        description: "stable = all devices; beta = only devices set to the beta channel"
        type: choice
        options: [stable, beta]
        default: stable
      rotate_key:
        description: "Allow a changed signing public key (OtaPublicKey.h). Locks out devices with the old key"
        type: boolean
        default: false

# A newer push cancels the older push build of the same branch. Manual runs (releases) have their
# own group, so a push never cancels or replaces a release in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # Same as the developer machines (docs/PROJECT_INFO.md). Core and library versions are NOT
  # set here: every build uses the sketch.yaml profile, so CI and local builds always match.
  ARDUINO_CLI_VERSION: 1.6.0
  # One OTA app slot in partitions.csv (app0/app1, 0x1E0000 = 1.875 MB): the build fails above it.
  APP_SLOT_BYTES: 1966080

jobs:
  # --------------------------------------------------
  # Read FW_BUILD from configure.h; for a release, refuse a build already released
  # --------------------------------------------------
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      build: ${{ steps.read.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read firmware version
        id: read
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          BUILD=$(sed -n 's/^#define FW_BUILD *\([0-9][0-9]*\).*/\1/p' configure.h)
          if ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read FW_BUILD from configure.h (got '$BUILD')"
            exit 1
          fi
          VERSION=".$BUILD"  # FW_VERSION in configure.h
          if [[ "$RELEASE" == "true" ]] && git rev-parse -q --verify "refs/tags/firmware-$VERSION" >/dev/null; then
            echo "::error::firmware-$VERSION is already released: bump FW_BUILD in configure.h"
            exit 1
          fi
          echo "Firmware version $VERSION (build $BUILD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------
  # Hardware-independent logic, compiled and run on the PC
  # --------------------------------------------------
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # mbedTLS for the signature test (the device uses the same library, in the ESP32 core).
      - name: Install mbedTLS
        run: sudo apt-get update -q && sudo apt-get install -y -q libmbedtls-dev
      # ArduinoJson (header-only) for the manifest tests, same version as sketch.yaml.
      - name: Get ArduinoJson
        run: |
          AJ=$(sed -n 's/.*- ArduinoJson (\(.*\))/\1/p' sketch.yaml | head -1)
          mkdir -p "$RUNNER_TEMP/arduinojson"
          curl -fsSL -o "$RUNNER_TEMP/arduinojson/ArduinoJson.h" \
            "https://github.com/bblanchon/ArduinoJson/releases/download/v$AJ/ArduinoJson-v$AJ.h"
          echo "ARDUINOJSON_INCLUDE=$RUNNER_TEMP/arduinojson" >> "$GITHUB_ENV"
      - name: Run host tests
        run: tests/host/run.sh
      # The setup app (web/): editor logic and the layout vectors shared with the firmware tests.
      - name: Web app tests
        run: node --test tests/web/
      # The compiled-in copy (src/web/generated/WebApp.h) matches web/ and stays under 60 KB gzipped.
      - name: Web app up to date
        run: python3 tools/web/build.py --check

  build:
    needs: version
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # arduino-cli ignores the build properties of sketch.yaml profiles, so the pin preset
          # define is passed here. Locally the preset follows the board (configure.h), except
          # esp32_waveshare, which needs the same flag (see docs/USER_GUIDE.md "arduino-cli").
          - name: ESP32
            profile: esp32
            preset: DEFAULT_PIN_PRESET_ESP32
          - name: ESP32-Waveshare
            profile: esp32_waveshare
            preset: DEFAULT_PIN_PRESET_ESP32_WAVESHARE
          - name: ESP32C6-FireBeetle
            profile: esp32c6_firebeetle
            preset: DEFAULT_PIN_PRESET_ESP32C6_FIREBEETLE
          - name: ESP32C6-SuperMini
            profile: esp32c6_supermini
            preset: DEFAULT_PIN_PRESET_ESP32C6_SUPERMINI

    steps:
      - uses: actions/checkout@v7

      # Downloaded core, toolchain and library archives (the profile installs them from there).
      - name: Cache Arduino downloads
        uses: actions/cache@v6
        with:
          path: ~/.arduino15/staging
          key: arduino-dl-${{ runner.os }}-cli-${{ env.ARDUINO_CLI_VERSION }}-${{ hashFiles('sketch.yaml') }}

      # arduino/setup-arduino-cli still runs on Node.js 20: use the official install script.
      - name: Setup Arduino CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/.local/bin" sh -s "$ARDUINO_CLI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The profile pins the core and library versions and installs them on first use.
      - name: Compile sketch
        run: |
          arduino-cli compile \
            --profile ${{ matrix.profile }} \
            --build-property "compiler.cpp.extra_flags=-D${{ matrix.preset }}" \
            --build-property "upload.maximum_size=$APP_SLOT_BYTES" \
            --export-binaries \
            --output-dir build_out \
            . 2>&1 | tee compile.log
          exit "${PIPESTATUS[0]}"

      - name: Firmware size check
        run: |
          APP=$(stat -c %s build_out/ESP32-eInk-Dashboard.ino.bin)
          RAM=$(sed -n 's/^Global variables use \([0-9]*\) bytes.*/\1/p' compile.log)
          RAM_MAX=$(sed -n 's/^Global variables use .* Maximum is \([0-9]*\) bytes\.$/\1/p' compile.log)
          pct() { awk -v a="$1" -v b="$2" 'BEGIN { printf "%.1f %%", 100 * a / b }'; }
          {
            echo "### ${{ matrix.name }} (\`${{ matrix.profile }}\`)"
            echo "| | Bytes | Limit | Used |"
            echo "|---|---:|---:|---:|"
            echo "| App image vs. OTA slot | $APP | $APP_SLOT_BYTES | $(pct "$APP" "$APP_SLOT_BYTES") |"
            echo "| Static RAM | $RAM | $RAM_MAX | $(pct "$RAM" "$RAM_MAX") |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "App image $APP bytes, OTA slot $APP_SLOT_BYTES bytes, static RAM $RAM of $RAM_MAX bytes"
          if (( APP > APP_SLOT_BYTES )); then
            echo "::error::App image ($APP bytes) is larger than the OTA slot ($APP_SLOT_BYTES bytes). See docs/IMPLEMENTATION_PLAN.md A.3."
            exit 1
          fi

      # The image names itself (OTA-ID string, src/update/UpdateClient.cpp): variant, display,
      # settings schema and build come from what was compiled, not from this file.
      - name: Read firmware id
        env:
          EXPECTED_BUILD: ${{ needs.version.outputs.build }}
        run: |
          ID=$(grep -a -o 'OTA-ID:[a-z0-9_][a-z0-9_]*:[a-z0-9_][a-z0-9_]*:[0-9][0-9]*:[0-9][0-9]*:END' \
                 build_out/ESP32-eInk-Dashboard.ino.bin | head -1 || true)
          if [[ -z "$ID" ]]; then
            echo "::error::No OTA-ID string in the image (src/update/UpdateClient.cpp; ids: a-z 0-9 _ only)"
            exit 1
          fi
          IFS=: read -r _ VARIANT DISPLAY SCHEMA BUILD _ <<< "$ID"
          echo "Firmware id: $ID"
          if [[ "$VARIANT" != "${{ matrix.profile }}" || "$BUILD" != "$EXPECTED_BUILD" ]]; then
            echo "::error::Image id '$ID' doesn't match profile ${{ matrix.profile }} / build $EXPECTED_BUILD"
            exit 1
          fi
          { echo "FW_DISPLAY=$DISPLAY"; echo "FW_SCHEMA=$SCHEMA"; echo "FW_BUILD=$BUILD"; } >> "$GITHUB_ENV"

      - name: Rename firmware
        run: |
          mkdir -p firmware
          cp build_out/*.bin firmware/
          cd firmware
          for f in *.bin; do
            mv "$f" "${{ matrix.name }}-$f"
          done
          # Which app image is for which board variant (read by tools/ota/make_manifest.py).
          printf '{"variant": "%s", "file": "%s", "display": "%s", "config_schema": %s, "build": %s}\n' \
            "${{ matrix.profile }}" "${{ matrix.name }}-ESP32-eInk-Dashboard.ino.bin" \
            "$FW_DISPLAY" "$FW_SCHEMA" "$FW_BUILD" > variant.json
          cat variant.json

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-Firmware
          path: firmware
          retention-days: 90

  # --------------------------------------------------
  # Release: manual run on main with "release" ticked, only if ALL builds and tests passed
  # --------------------------------------------------
  release:
    needs: [version, host-tests, build]
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Devices only accept manifests signed for the public key they carry. A changed key in the
      # repository (e.g. a re-run of make_signing_key.sh) would lock all of them out: refuse it
      # unless "rotate_key" is ticked on purpose.
      - name: Signing key unchanged since the last release
        env:
          ROTATE: ${{ inputs.rotate_key }}
        run: |
          PREV=$(git tag -l 'firmware-*' --sort=-creatordate | while read -r t; do
                   if git cat-file -e "$t:src/update/OtaPublicKey.h" 2>/dev/null; then echo "$t"; break; fi
                 done || true)
          if [[ -z "$PREV" ]]; then
            echo "No earlier release with a signing key: first signed release."
          elif git diff --quiet "$PREV" HEAD -- src/update/OtaPublicKey.h; then
            echo "Public key unchanged since $PREV."
          elif [[ "$ROTATE" == "true" ]]; then
            echo "::warning::Signing key changed since $PREV (rotate_key ticked): devices with the old key need a USB flash."
          else
            echo "::error::src/update/OtaPublicKey.h changed since $PREV. Devices carry the old key and would reject this and every later release. Restore the old key, or tick rotate_key if the old private key is lost or leaked."
            exit 1
          fi

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          path: firmware

      # Inputs go through env, never straight into the script (no shell injection).
      - name: Write manifest.json and release notes
        env:
          BUILD: ${{ needs.version.outputs.build }}
          VERSION: ${{ needs.version.outputs.version }}
          WHATS_NEW: ${{ inputs.whats_new }}
          MIN_BUILD: ${{ inputs.min_build }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python3 -I tools/ota/make_manifest.py --build "$BUILD" --version "$VERSION" \
            --tag "firmware-$VERSION" --min-build "${MIN_BUILD:-0}" --notes "$WHATS_NEW" \
            --channel "$CHANNEL" --dir firmware --out manifest.json --notes-out release_notes.md
          cat manifest.json release_notes.md

      # Devices only trust a manifest signed with the private key whose public key they carry
      # (src/update/OtaPublicKey.h). Checked here against that public key before publishing, so a
      # wrong secret stops the release instead of locking out the devices.
      - name: Sign manifest.json
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [[ -z "$OTA_SIGNING_KEY" ]]; then
            echo "::error::Secret OTA_SIGNING_KEY is not set (see docs/OTA_UPDATES.md, Signing)"
            exit 1
          fi
          KEY="$RUNNER_TEMP/ota_signing_key.pem"
          trap 'rm -f "$KEY"' EXIT
          ( umask 077; printf '%s\n' "$OTA_SIGNING_KEY" > "$KEY" )
          openssl dgst -sha256 -sign "$KEY" -out manifest.sig manifest.json
          rm -f "$KEY"
          sed -n 's/^    "\(.*\)\\n"$/\1/p' src/update/OtaPublicKey.h > "$RUNNER_TEMP/ota_public_key.pem"
          if ! openssl dgst -sha256 -verify "$RUNNER_TEMP/ota_public_key.pem" -signature manifest.sig manifest.json; then
            echo "::error::OTA_SIGNING_KEY doesn't match the public key in src/update/OtaPublicKey.h"
            exit 1
          fi

      - name: Create release and upload firmware
        uses: softprops/action-gh-release@v3
        with:
          tag_name: firmware-${{ needs.version.outputs.version }}
          name: ESP32 Firmware Build ${{ needs.version.outputs.version }}${{ inputs.channel == 'beta' && ' (beta)' || '' }}
          body_path: release_notes.md
          prerelease: ${{ inputs.channel == 'beta' }}
          make_latest: ${{ inputs.channel == 'beta' && 'false' || 'true' }}
          files: |
            firmware/**/*.bin
            manifest.json
            manifest.sig

      # Beta devices read releases/download/beta/manifest.json. Every release (beta or stable)
      # replaces it, so beta devices get the newest build of either kind.
      - name: Update the beta channel
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if ! gh release view beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create beta --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Beta channel" --notes "Channel file for devices set to beta. Not a firmware release."
          fi
          gh release upload beta manifest.json manifest.sig --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit beta --repo "$GITHUB_REPOSITORY" --prerelease \
            --notes "Channel file for devices set to beta: currently firmware $VERSION. Not a firmware release."
