name: Build firmware

# Every push and pull request: host tests + firmware build for every sketch.yaml profile with a
# size check. A GitHub release is only published when started by hand from main with "release".
# The release carries manifest.json: devices install it over the air (docs/OTA_UPDATES.md).
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (main only; FW_BUILD must not be released yet)
        type: boolean
        default: false
      whats_new:
        description: "What's new, shown on the devices: up to 3 short lines separated by | (max. 70 characters each)"
        type: string
        default: ""
      min_build:
        description: Oldest build that may install this release over the air (0 = any)
        type: string
        default: "0"

# A newer push cancels the older push build of the same branch. Manual runs (releases) have their
# own group, so a push never cancels or replaces a release in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # Same as the developer machines (docs/PROJECT_INFO.md). Core and library versions are NOT
  # set here: every build uses the sketch.yaml profile, so CI and local builds always match.
  ARDUINO_CLI_VERSION: 1.6.0
  # One OTA app slot in partitions.csv (app0/app1, 0x1E0000 = 1.875 MB): the build fails above it.
  APP_SLOT_BYTES: 1966080

jobs:
  # --------------------------------------------------
  # Read FW_BUILD from configure.h; for a release, refuse a build already released
  # --------------------------------------------------
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      build: ${{ steps.read.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read firmware version
        id: read
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          BUILD=$(sed -n 's/^#define FW_BUILD *\([0-9][0-9]*\).*/\1/p' configure.h)
          if ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read FW_BUILD from configure.h (got '$BUILD')"
            exit 1
          fi
          VERSION=".$BUILD"  # FW_VERSION in configure.h
          if [[ "$RELEASE" == "true" ]] && git rev-parse -q --verify "refs/tags/firmware-$VERSION" >/dev/null; then
            echo "::error::firmware-$VERSION is already released: bump FW_BUILD in configure.h"
            exit 1
          fi
          echo "Firmware version $VERSION (build $BUILD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------
  # Hardware-independent logic, compiled and run on the PC
  # --------------------------------------------------
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # ArduinoJson (header-only) for the manifest tests, same version as sketch.yaml.
      - name: Get ArduinoJson
        run: |
          AJ=$(sed -n 's/.*- ArduinoJson (\(.*\))/\1/p' sketch.yaml | head -1)
          mkdir -p "$RUNNER_TEMP/arduinojson"
          curl -fsSL -o "$RUNNER_TEMP/arduinojson/ArduinoJson.h" \
            "https://github.com/bblanchon/ArduinoJson/releases/download/v$AJ/ArduinoJson-v$AJ.h"
          echo "ARDUINOJSON_INCLUDE=$RUNNER_TEMP/arduinojson" >> "$GITHUB_ENV"
      - name: Run host tests
        run: tests/host/run.sh

  build:
    needs: version
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # arduino-cli ignores the build properties of sketch.yaml profiles, so the pin preset
          # define is passed here. Locally the preset follows the board (configure.h), except
          # esp32_waveshare, which needs the same flag (see docs/USER_GUIDE.md "arduino-cli").
          - name: ESP32
            profile: esp32
            preset: DEFAULT_PIN_PRESET_ESP32
          - name: ESP32-Waveshare
            profile: esp32_waveshare
            preset: DEFAULT_PIN_PRESET_ESP32_WAVESHARE
          - name: ESP32C6-FireBeetle
            profile: esp32c6_firebeetle
            preset: DEFAULT_PIN_PRESET_ESP32C6_FIREBEETLE
          - name: ESP32C6-SuperMini
            profile: esp32c6_supermini
            preset: DEFAULT_PIN_PRESET_ESP32C6_SUPERMINI

    steps:
      - uses: actions/checkout@v7

      # Downloaded core, toolchain and library archives (the profile installs them from there).
      - name: Cache Arduino downloads
        uses: actions/cache@v6
        with:
          path: ~/.arduino15/staging
          key: arduino-dl-${{ runner.os }}-cli-${{ env.ARDUINO_CLI_VERSION }}-${{ hashFiles('sketch.yaml') }}

      # arduino/setup-arduino-cli still runs on Node.js 20: use the official install script.
      - name: Setup Arduino CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/.local/bin" sh -s "$ARDUINO_CLI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The profile pins the core and library versions and installs them on first use.
      - name: Compile sketch
        run: |
          arduino-cli compile \
            --profile ${{ matrix.profile }} \
            --build-property "compiler.cpp.extra_flags=-D${{ matrix.preset }}" \
            --build-property "upload.maximum_size=$APP_SLOT_BYTES" \
            --export-binaries \
            --output-dir build_out \
            . 2>&1 | tee compile.log
          exit "${PIPESTATUS[0]}"

      - name: Firmware size check
        run: |
          APP=$(stat -c %s build_out/ESP32-eInk-Dashboard.ino.bin)
          RAM=$(sed -n 's/^Global variables use \([0-9]*\) bytes.*/\1/p' compile.log)
          RAM_MAX=$(sed -n 's/^Global variables use .* Maximum is \([0-9]*\) bytes\.$/\1/p' compile.log)
          pct() { awk -v a="$1" -v b="$2" 'BEGIN { printf "%.1f %%", 100 * a / b }'; }
          {
            echo "### ${{ matrix.name }} (\`${{ matrix.profile }}\`)"
            echo "| | Bytes | Limit | Used |"
            echo "|---|---:|---:|---:|"
            echo "| App image vs. OTA slot | $APP | $APP_SLOT_BYTES | $(pct "$APP" "$APP_SLOT_BYTES") |"
            echo "| Static RAM | $RAM | $RAM_MAX | $(pct "$RAM" "$RAM_MAX") |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "App image $APP bytes, OTA slot $APP_SLOT_BYTES bytes, static RAM $RAM of $RAM_MAX bytes"
          if (( APP > APP_SLOT_BYTES )); then
            echo "::error::App image ($APP bytes) is larger than the OTA slot ($APP_SLOT_BYTES bytes). See docs/IMPLEMENTATION_PLAN.md A.3."
            exit 1
          fi

      - name: Rename firmware
        run: |
          mkdir -p firmware
          cp build_out/*.bin firmware/
          cd firmware
          for f in *.bin; do
            mv "$f" "${{ matrix.name }}-$f"
          done
          # Which app image is for which board variant (read by tools/ota/make_manifest.py).
          printf '{"variant": "%s", "file": "%s"}\n' "${{ matrix.profile }}" \
            "${{ matrix.name }}-ESP32-eInk-Dashboard.ino.bin" > variant.json

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-Firmware
          path: firmware
          retention-days: 90

  # --------------------------------------------------
  # Release: manual run on main with "release" ticked, only if ALL builds and tests passed
  # --------------------------------------------------
  release:
    needs: [version, host-tests, build]
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          path: firmware

      # Inputs go through env, never straight into the script (no shell injection).
      - name: Write manifest.json and release notes
        env:
          BUILD: ${{ needs.version.outputs.build }}
          VERSION: ${{ needs.version.outputs.version }}
          WHATS_NEW: ${{ inputs.whats_new }}
          MIN_BUILD: ${{ inputs.min_build }}
        run: |
          python3 -I tools/ota/make_manifest.py --build "$BUILD" --version "$VERSION" \
            --tag "firmware-$VERSION" --min-build "${MIN_BUILD:-0}" --notes "$WHATS_NEW" \
            --dir firmware --out manifest.json --notes-out release_notes.md
          cat release_notes.md

      - name: Create release and upload firmware
        uses: softprops/action-gh-release@v3
        with:
          tag_name: firmware-${{ needs.version.outputs.version }}
          name: ESP32 Firmware Build ${{ needs.version.outputs.version }}
          body_path: release_notes.md
          files: |
            firmware/**/*.bin
            manifest.json
