# Build profiles: the single source of the core and library versions, for local builds and CI
# (.github/workflows/compile.yml builds every profile).
#
# arduino-cli ignores build properties in profiles, so compile flags go on the command line:
# - The pin preset follows the board (configure.h). esp32 and esp32_waveshare are the same board,
#   so esp32_waveshare needs --build-property "compiler.cpp.extra_flags=-DDEFAULT_PIN_PRESET_ESP32_WAVESHARE".
# - PartitionScheme=custom (partitions.csv) leaves the size limit at the flash size: CI checks the
#   real limits (app0 and the planned OTA slot), local builds don't.
profiles:
  esp32:
    fqbn: esp32:esp32:esp32:PartitionScheme=custom
    platforms:
      - platform: esp32:esp32 (3.3.7)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - GxEPD2 (1.6.8)
      - Adafruit GFX Library (1.12.5)
      - Adafruit BusIO (1.17.4)
      - ArduinoJson (7.4.3)
      - PubSubClient (2.8)
  esp32_waveshare:
    fqbn: esp32:esp32:esp32:PartitionScheme=custom
    platforms:
      - platform: esp32:esp32 (3.3.7)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - GxEPD2 (1.6.8)
      - Adafruit GFX Library (1.12.5)
      - Adafruit BusIO (1.17.4)
      - ArduinoJson (7.4.3)
      - PubSubClient (2.8)
  esp32c6_firebeetle:
    fqbn: esp32:esp32:dfrobot_firebeetle2_esp32c6:PartitionScheme=custom,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.7)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - GxEPD2 (1.6.8)
      - Adafruit GFX Library (1.12.5)
      - Adafruit BusIO (1.17.4)
      - ArduinoJson (7.4.3)
      - PubSubClient (2.8)
  esp32c6_supermini:
    fqbn: esp32:esp32:makergo_c6_supermini:PartitionScheme=custom,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.7)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - GxEPD2 (1.6.8)
      - Adafruit GFX Library (1.12.5)
      - Adafruit BusIO (1.17.4)
      - ArduinoJson (7.4.3)
      - PubSubClient (2.8)
